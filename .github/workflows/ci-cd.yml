name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '9'

jobs:
  # Quality Gates - Always run
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Security audit
        run: pnpm audit --audit-level moderate

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist/
            node_modules/
          key: build-${{ github.sha }}

  # Create Release (manual trigger only)
  # TEMPORARY, do not merge: shows why npm rejects the trusted-publishing
  # token exchange. It publishes nothing and prints no token.
  oidc-probe:
    name: OIDC probe (temporary)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm release that supports trusted publishing
        run: npm install -g npm@11

      - name: Show the identity GitHub presents and npm's answer to it
        run: |
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$ID_TOKEN"
          echo "--- claims"
          node -e 'const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url").toString());const k=["iss","sub","aud","repository","repository_id","repository_owner","repository_owner_id","workflow_ref","job_workflow_ref","ref","event_name","environment","repository_visibility","runner_environment"];console.log(JSON.stringify(Object.fromEntries(k.map((x)=>[x,p[x]])),null,2))' "$ID_TOKEN"
          # The new name, the old name (its publisher was set up before the
          # repo was renamed) and a name that does not exist, to compare answers.
          for PKG in '@arafeymasood%2frabot' 'rafey-shell' '@arafeymasood%2fno-such-package-probe'; do
            echo "--- exchange for $PKG"
            STATUS=$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $ID_TOKEN" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$PKG")
            echo "HTTP $STATUS"
            jq -c 'if type == "object" and has("token") then (.token = "<received, not shown>") else . end' "$RUNNER_TEMP/exchange.json" || head -c 400 "$RUNNER_TEMP/exchange.json"
            rm -f "$RUNNER_TEMP/exchange.json"
          done

      - name: Dry-run publish with verbose logging
        run: npm publish --access public --dry-run --ignore-scripts --loglevel verbose 2>&1 | grep -i -E "oidc|provenance|npm (error|warn)|Publishing to" || true

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Calculate new version
        id: version
        run: |
          NEW_VERSION=$(npm version ${{ github.event.inputs.version }} --no-git-tag-version)
          echo "NEW_VERSION=${NEW_VERSION#v}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${NEW_VERSION#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG="🎉 **Initial Release**"
          else
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%an)" --no-merges | head -20)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Minor updates and improvements"
            fi
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update package.json and create tag
        run: |
          git add package.json
          git commit -m "🔖 Release v${{ steps.version.outputs.NEW_VERSION }}"
          git tag ${{ steps.version.outputs.TAG_NAME }}
          git push origin main
          git push origin ${{ steps.version.outputs.TAG_NAME }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          release_name: Release ${{ steps.version.outputs.TAG_NAME }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          body: |
            ## 🚀 Release ${{ steps.version.outputs.TAG_NAME }}
            
            ### 📋 Changes
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ### 📦 Installation
            ```bash
            npm install -g @arafeymasood/rabot@${{ steps.version.outputs.NEW_VERSION }}
            ```

  # Publish from the release workflow, or from a tag push
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: [quality, create-release]
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.create-release.result == 'skipped') ||
        (github.event_name == 'workflow_dispatch' && needs.create-release.result == 'success')
      )
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            dist/
            node_modules/
          key: build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Use an npm release that supports trusted publishing
        run: npm install -g npm@11

      - name: Update package version to match tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ needs.create-release.outputs.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
          else
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'

      - name: Update package.json for GitHub Packages
        run: |
          sed -i 's/"name": "@arafeymasood\/rabot"/"name": "@abdurmasood\/rabot"/' package.json

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}